[package]
name = "rtop"
version = "0.1.0"
description = "A macOS-first terminal system monitor"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.8", features = ["derive"] }
crossterm = "0.29.0"
directories = "6.0.0"
libc = "0.2.191"
nix = { version = "0.32.0", features = ["signal", "process"] }
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
sysinfo = "0.40.4"
thiserror = "2.0.21"
toml = "1.2.1"
tracing = "0.1.44"
tracing-appender = "0.2.5"

[dev-dependencies]
insta = "1.49.0"

[lints.cargo]
unused_dependencies = "allow"
